name: Build and publish JOHNNY firmware

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build Cardputer-Adv firmware
        run: pio run -e cardputer-adv
      - name: Publish firmware asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: .pio/build/cardputer-adv/firmware.bin
          name: JOHNNY ${{ github.ref_name }}
          generate_release_notes: true
