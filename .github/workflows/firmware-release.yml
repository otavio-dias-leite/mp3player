name: Build and publish JOHNNY firmware

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build Cardputer-Adv firmware
        run: pio run -e cardputer-adv
      - name: Read firmware version
        id: version
        shell: bash
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Publish versioned firmware release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: main
          name: JOHNNY v${{ steps.version.outputs.value }}
          files: .pio/build/cardputer-adv/firmware.bin
          generate_release_notes: true
          fail_on_unmatched_files: true
