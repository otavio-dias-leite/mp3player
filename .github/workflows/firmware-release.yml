name: Build and publish JOHNNY firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Read firmware version
        id: version
        shell: bash
        run: echo "value=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Build Cardputer-Adv firmware
        run: pio run -e cardputer-adv
      - name: Assemble complete flash image and install guide
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          BUILD=".pio/build/cardputer-adv"
          OUT="release"
          mkdir -p "$OUT"
          BOOT_APP0="$(find "$HOME/.platformio/packages/framework-arduinoespressif32" -name boot_app0.bin -print -quit)"
          ESPTOOL="$(find "$HOME/.platformio/packages/tool-esptoolpy" -name esptool.py -print -quit)"
          test -s "$BUILD/bootloader.bin"
          test -s "$BUILD/partitions.bin"
          test -s "$BUILD/firmware.bin"
          test -n "$BOOT_APP0"
          test -n "$ESPTOOL"
          cp "$BUILD/firmware.bin" "$OUT/firmware.bin"
          cp "$BUILD/bootloader.bin" "$OUT/bootloader.bin"
          cp "$BUILD/partitions.bin" "$OUT/partitions.bin"
          cp "$BOOT_APP0" "$OUT/boot_app0.bin"
          python "$ESPTOOL" --chip esp32s3 merge_bin \
            -o "$OUT/johnny-cardputer-adv-full.bin" \
            --flash_mode dio --flash_freq 80m --flash_size 8MB \
            0x0 "$OUT/bootloader.bin" \
            0x8000 "$OUT/partitions.bin" \
            0xe000 "$OUT/boot_app0.bin" \
            0x10000 "$OUT/firmware.bin"
          cat > "$OUT/LEIA-PRIMEIRO.txt" <<EOF
          JOHNNY v${VERSION} — M5STACK CARDPUTER ADV (ESP32-S3)

          firmware.bin: atualização OTA.
          johnny-cardputer-adv-full.bin: instalação completa por USB.

          MÉTODO RECOMENDADO:
          1. Abra https://otavio-dias-leite.github.io/johnny/ no Chrome ou Edge.
          2. Conecte o Cardputer por USB mantendo G0 pressionado para entrar em modo de gravação.
          3. Clique em FLASH FIRMWARE, selecione a porta serial e confirme.
          4. Aguarde a conclusão antes de desconectar.

          MÉTODO ALTERNATIVO NO ARCH LINUX:
          1. Instale esptool: sudo pacman -S esptool
          2. Entre no modo de gravação segurando G0 ao conectar USB.
          3. Identifique a porta: ls /dev/ttyACM* /dev/ttyUSB* 2>/dev/null
          4. Grave a imagem completa (substitua a porta):
             esptool --chip esp32s3 --port /dev/ttyACM0 --baud 460800 write-flash 0x0 johnny-cardputer-adv-full.bin

          Se houver erro de permissão na porta serial, adicione seu usuário ao grupo uucp
          e entre novamente na sessão. Não remova o cartão durante operações.
          EOF
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: johnny-cardputer-adv-${{ github.sha }}
          path: release/*
          if-no-files-found: error
      - name: Validate release tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          EXPECTED="v$(tr -d '\r\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "$EXPECTED"
      - name: Publish versioned firmware release
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: main
          name: JOHNNY v${{ steps.version.outputs.value }}
          files: |
            release/firmware.bin
            release/johnny-cardputer-adv-full.bin
            release/LEIA-PRIMEIRO.txt
            release/bootloader.bin
            release/partitions.bin
            release/boot_app0.bin
          generate_release_notes: true
          fail_on_unmatched_files: true
