name: Firmware build

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'firmware/*.bin'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cardputer-adv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build firmware
        run: pio run -e cardputer-adv
      - name: Package firmware artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/firmware
          cp .pio/build/cardputer-adv/bootloader.bin release/firmware/bootloader.bin
          cp .pio/build/cardputer-adv/partitions.bin release/firmware/partitions.bin
          cp .pio/build/cardputer-adv/firmware.bin release/firmware/firmware.bin
          BOOT_APP0="$(find "$HOME/.platformio/packages/framework-arduinoespressif32" -name boot_app0.bin -print -quit)"
          test -n "$BOOT_APP0"
          cp "$BOOT_APP0" release/firmware/boot_app0.bin
      - name: Upload compiled firmware
        uses: actions/upload-artifact@v4
        with:
          name: johnny-firmware-${{ github.sha }}
          path: release/firmware/
          if-no-files-found: error

      - name: Publish rolling latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="johnny-${GITHUB_SHA:0:12}"
          TITLE="JOHNNY latest — ${GITHUB_SHA:0:7}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TITLE" --notes "Automated Cardputer ADV firmware build from commit ${GITHUB_SHA}." --latest
          fi
          gh release upload "$TAG" release/firmware/* --clobber
          gh release edit "$TAG" --title "$TITLE" --latest
