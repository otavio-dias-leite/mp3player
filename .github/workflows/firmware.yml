name: Firmware build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'firmware/*.bin'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cardputer-adv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build firmware
        run: pio run -e cardputer-adv
      - name: Assemble complete USB image
        shell: bash
        run: |
          set -euo pipefail
          BUILD=".pio/build/cardputer-adv"
          OUT="release/firmware"
          mkdir -p "$OUT"
          BOOT_APP0="$(find "$HOME/.platformio/packages/framework-arduinoespressif32" -name boot_app0.bin -print -quit)"
          ESPTOOL="$(find "$HOME/.platformio/packages/tool-esptoolpy" -name esptool.py -print -quit)"
          test -s "$BUILD/bootloader.bin"
          test -s "$BUILD/partitions.bin"
          test -s "$BUILD/firmware.bin"
          test -n "$BOOT_APP0"
          test -n "$ESPTOOL"
          cp "$BUILD/bootloader.bin" "$OUT/bootloader.bin"
          cp "$BUILD/partitions.bin" "$OUT/partitions.bin"
          cp "$BUILD/firmware.bin" "$OUT/firmware.bin"
          cp "$BOOT_APP0" "$OUT/boot_app0.bin"
          python "$ESPTOOL" --chip esp32s3 merge_bin \
            -o "$OUT/mp3-player-cardputer-adv-full.bin" \
            --flash_mode dio --flash_freq 80m --flash_size 8MB \
            0x0 "$OUT/bootloader.bin" \
            0x8000 "$OUT/partitions.bin" \
            0xe000 "$OUT/boot_app0.bin" \
            0x10000 "$OUT/firmware.bin"
          test -s "$OUT/mp3-player-cardputer-adv-full.bin"
          ls -lh "$OUT"/*.bin
      - name: Upload compiled firmware
        uses: actions/upload-artifact@v4
        with:
          name: mp3-player-cardputer-adv-${{ github.sha }}
          path: release/firmware/
          if-no-files-found: error
      - name: Publish rolling latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="mp3-player-$(echo "$GITHUB_SHA" | cut -c1-12)"
          TITLE="MP3 PLAYER latest — $(echo "$GITHUB_SHA" | cut -c1-7)"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TITLE" --notes "Complete USB image and individual firmware parts built from commit $GITHUB_SHA." --target "$GITHUB_SHA" --latest
          fi
          gh release upload "$TAG" release/firmware/* --clobber
          gh release edit "$TAG" --title "$TITLE" --latest
