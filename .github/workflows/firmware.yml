name: Firmware build

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'firmware/*.bin'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cardputer-adv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build firmware
        run: pio run -e cardputer-adv
      - name: Publish installer binaries to the GitHub Pages source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p firmware
          cp .pio/build/cardputer-adv/bootloader.bin firmware/bootloader.bin
          cp .pio/build/cardputer-adv/partitions.bin firmware/partitions.bin
          cp .pio/build/cardputer-adv/firmware.bin firmware/firmware.bin
          BOOT_APP0="$(find "$HOME/.platformio/packages/framework-arduinoespressif32" -name boot_app0.bin -print -quit)"
          test -n "$BOOT_APP0"
          cp "$BOOT_APP0" firmware/boot_app0.bin
      - name: Commit installer binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/bootloader.bin firmware/partitions.bin firmware/boot_app0.bin firmware/firmware.bin
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish JOHNNY installer firmware [skip ci]'
          git push
