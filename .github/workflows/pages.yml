name: Deploy Johnny website

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static website
        run: |
          mkdir -p _site
          cp index.html style.css _site/
          touch _site/.nojekyll
          if [ -d web/assets ]; then cp -R web/assets _site/assets; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-site
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
