name: Build and deploy Johnny OS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-firmware:
    name: Compile ESP32-S3 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Compile
        run: pio run -e cardputer-adv
      - name: Assemble firmware release files
        shell: bash
        run: |
          set -euo pipefail
          BUILD=".pio/build/cardputer-adv"
          test -s "$BUILD/bootloader.bin"
          test -s "$BUILD/partitions.bin"
          test -s "$BUILD/firmware.bin"
          mkdir -p release/firmware
          cp "$BUILD/bootloader.bin" release/firmware/bootloader.bin
          cp "$BUILD/partitions.bin" release/firmware/partitions.bin
          cp "$BUILD/firmware.bin" release/firmware/firmware.bin
          cat > release/firmware/manifest.json <<'EOF'
          {
            "name": "Johnny OS — Cardputer-Adv",
            "version": "0.1.4",
            "new_install_prompt_erase": true,
            "builds": [{
              "chipFamily": "ESP32-S3",
              "parts": [
                {"path": "bootloader.bin", "offset": 0},
                {"path": "partitions.bin", "offset": 32768},
                {"path": "firmware.bin", "offset": 65536}
              ]
            }]
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: johnny-firmware
          path: release/firmware/
          if-no-files-found: error

  deploy:
    name: Publish website and installer
    runs-on: ubuntu-latest
    needs: build-firmware
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: johnny-firmware
          path: _site/firmware
      - name: Assemble website
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html style.css _site/
          touch _site/.nojekyll
          if [ -d web/assets ]; then cp -R web/assets _site/assets; fi
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("_site/firmware/manifest.json")
          data = json.loads(p.read_text())
          base = "https://otavio-dias-leite.github.io/johnny/firmware/"
          for part in data["builds"][0]["parts"]:
              part["path"] = base + part["path"]
          p.write_text(json.dumps(data, indent=2) + "\n")
          PY
          for f in bootloader.bin partitions.bin firmware.bin manifest.json; do
            test -s "_site/firmware/$f"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
