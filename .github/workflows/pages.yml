name: Deploy JOHNNY website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build static website
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          mkdir -p _site/firmware
          cp index.html style.css transfer.html _site/
          cp firmware/manifest.json _site/firmware/manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          version = Path("VERSION").read_text().strip()
          for name in ("index.html", "transfer.html"):
              page = Path("_site") / name
              page.write_text(page.read_text().replace("@JOHNNY_VERSION@", version))
          manifest = Path("_site/firmware/manifest.json")
          data = json.loads(manifest.read_text())
          base = f"https://github.com/otavio-dias-leite/johnny/releases/download/v{version}/"
          for part in data["builds"][0]["parts"]:
              filename = part["path"].split("/")[-1].split("?")[0]
              part["path"] = base + filename
          data["version"] = version
          manifest.write_text(json.dumps(data, indent=2) + "\n")
          PY
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
