name: Deploy JOHNNY website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build static website and bundle firmware locally
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          mkdir -p _site/firmware
          cp index.html style.css transfer.html _site/
          cp firmware/manifest.json _site/firmware/manifest.json
          ASSET_URL="https://github.com/otavio-dias-leite/johnny/releases/download/v${VERSION}/johnny-cardputer-adv-full.bin"
          echo "Fetching firmware asset: ${ASSET_URL}"
          for attempt in $(seq 1 30); do
            if curl --fail --location --silent --show-error "${ASSET_URL}" -o _site/firmware/johnny-cardputer-adv-full.bin; then
              break
            fi
            rm -f _site/firmware/johnny-cardputer-adv-full.bin
            echo "Firmware release not ready (attempt ${attempt}/30); retrying..."
            sleep 10
          done
          test -s _site/firmware/johnny-cardputer-adv-full.bin
          python - <<'PY'
          import json
          from pathlib import Path
          version = Path("VERSION").read_text().strip()
          for name in ("index.html", "transfer.html"):
              page = Path("_site") / name
              page.write_text(page.read_text().replace("@JOHNNY_VERSION@", version))
          manifest = Path("_site/firmware/manifest.json")
          data = json.loads(manifest.read_text())
          data["version"] = version
          data["builds"][0]["parts"] = [{
              "path": "johnny-cardputer-adv-full.bin",
              "offset": 0
          }]
          manifest.write_text(json.dumps(data, indent=2) + "\\n")
          PY
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
