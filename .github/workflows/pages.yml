name: Deploy MP3 PLAYER website

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "firmware/manifest.json"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Build and publish MP3 PLAYER firmware"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main branch
        uses: actions/checkout@v4

      - name: Locate latest available firmware release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          TAG="v$VERSION"
          API="https://api.github.com/repos/otavio-dias-leite/mp3player/releases/tags/$TAG"
          HEADERS=(-H "Accept: application/vnd.github+json"
                   -H "Authorization: Bearer $GH_TOKEN"
                   -H "X-GitHub-Api-Version: 2022-11-28")
          if ! curl --fail --silent --show-error --retry 3 --retry-delay 2 "${HEADERS[@]}" "$API" -o /tmp/release.json; then
            echo "Release $TAG is not published yet; using the latest published firmware."
            curl --fail --silent --show-error --retry 5 --retry-delay 3 \
              "${HEADERS[@]}" \
              "https://api.github.com/repos/otavio-dias-leite/mp3player/releases/latest" \
              -o /tmp/release.json
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads(Path("/tmp/release.json").read_text())
          asset = next((a for a in release.get("assets", [])
                        if a.get("name") == "mp3-player-cardputer-adv-full.bin"), None)
          assert asset and asset.get("browser_download_url"), "Full MP3 Player firmware is missing from published release"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("version=" + release["tag_name"] + "\n")
              out.write("asset_url=" + asset["browser_download_url"] + "\n")
          PY

      - name: Assemble website with an actually published firmware release
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_ASSET_URL: ${{ steps.release.outputs.asset_url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/firmware
          cp index.html style.css _site/
          curl --fail --location --retry 5 --retry-delay 3 \
            "$RELEASE_ASSET_URL" -o _site/firmware/mp3-player-cardputer-adv-full.bin
          test "$(stat -c %s _site/firmware/mp3-player-cardputer-adv-full.bin)" -gt 100000
          cp firmware/manifest.json _site/firmware/manifest.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          version = os.environ["RELEASE_VERSION"]
          page = Path("_site/index.html")
          page.write_text(page.read_text().replace("@MP3_PLAYER_VERSION@", version))
          manifest = Path("_site/firmware/manifest.json")
          data = json.loads(manifest.read_text())
          data["version"] = version
          data["builds"][0]["parts"] = [{"path": "mp3-player-cardputer-adv-full.bin", "offset": 0}]
          manifest.write_text(json.dumps(data, indent=2) + "\n")
          PY
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/firmware/manifest.json
          test -s _site/firmware/mp3-player-cardputer-adv-full.bin

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
