name: Build firmware and deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Compile Cardputer-Adv firmware
        run: pio run -e cardputer-adv
      - name: Assemble site and flash images
        run: |
          mkdir -p _site/firmware
          cp index.html style.css _site/
          cp .nojekyll _site/ 2>/dev/null || true
          cp .pio/build/cardputer-adv/bootloader.bin _site/firmware/bootloader.bin
          cp .pio/build/cardputer-adv/partitions.bin _site/firmware/partitions.bin
          cp .pio/build/cardputer-adv/firmware.bin _site/firmware/firmware.bin
          cp firmware/manifest.json _site/firmware/manifest.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
