<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10051b"><title>JOHNNY / USB TRANSFER</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap');
:root{color-scheme:dark;--bg:#10051b;--panel:#21102f;--purple:#a855f7;--pink:#f472d0;--cyan:#8be9ff;--line:#45205e;--muted:#a99bb9}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#351050,transparent 55%),var(--bg);color:#fbf6ff;font-family:'Space Grotesk',sans-serif}
main{width:min(760px,calc(100% - 32px));margin:auto}header{display:flex;justify-content:space-between;align-items:center;padding:24px 0;border-bottom:1px solid #ffffff22;font:11px 'Space Mono',monospace;color:var(--muted)}
header a{font:700 16px 'Space Grotesk',sans-serif;letter-spacing:.12em;color:#fff;text-decoration:none}
h1{font-size:clamp(40px,8vw,72px);letter-spacing:-.07em;margin:45px 0 24px}
button,.upload{border:1px solid #dc8aff;background:linear-gradient(100deg,#7627c7,#b12ac8);color:white;padding:13px 18px;font:700 11px 'Space Mono',monospace;cursor:pointer}
button.secondary{background:#21102f;border-color:var(--line)}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
input[type=file]{display:none}.upload{display:inline-block}
#status{min-height:24px;margin:10px 0 20px;color:var(--cyan);font:11px 'Space Mono',monospace}
#path{color:var(--pink);font:12px 'Space Mono',monospace;margin:10px 0}
#files{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 9px;border-bottom:1px solid #ffffff18}
.filename{min-width:0;overflow-wrap:anywhere;font-size:13px}.dir{color:var(--cyan);cursor:pointer}
.actions{display:flex;gap:6px;flex-shrink:0}.actions button{padding:8px 10px;font-size:10px}
footer{padding:30px 0;color:var(--muted);font:10px 'Space Mono',monospace}
@media(max-width:500px){.row{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}}
</style>
</head>
<body>
<main>
<header><a href="index.html">JOHNNY</a><span>USB / MICROSD</span></header>
<h1>FILE TRANSFER</h1>
<div class="bar">
<button id="connect">CONNECT USB</button>
<button id="disconnect" class="secondary" disabled>DISCONNECT</button>
<label class="upload" id="uploadLabel" style="opacity:.4;pointer-events:none">UPLOAD FILE<input id="upload" type="file" multiple disabled></label>
<button id="refresh" class="secondary" disabled>REFRESH</button>
</div>
<div id="status">CONNECT THE CARDPUTER IN USB TRANSFER MODE.</div>
<div id="path">/</div>
<div id="files"></div>
<footer>CHROME / EDGE • WEB SERIAL • FAT32 MICROSD</footer>
</main>
<script>
const $=id=>document.getElementById(id);
let port=null,reader=null,writer=null,rx=new Uint8Array(0),connected=false,currentPath="/";
const enc=new TextEncoder(),dec=new TextDecoder();
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function append(bytes){const next=new Uint8Array(rx.length+bytes.length);next.set(rx);next.set(bytes,rx.length);rx=next;}
async function fill(){const r=await reader.read();if(r.done)throw new Error("USB connection closed");if(r.value)append(r.value);}
async function readLine(){
  while(true){const i=rx.indexOf(10);if(i>=0){const line=dec.decode(rx.slice(0,i)).replace(/\r$/,"");rx=rx.slice(i+1);return line;}await fill();}
}
async function readExact(n){
  while(rx.length<n)await fill();
  const out=rx.slice(0,n);rx=rx.slice(n);return out;
}
async function sendLine(line){await writer.write(enc.encode(line+"\n"));}
function setStatus(s){$("status").textContent=s;}
function fullPath(name){return currentPath==="/" ? "/"+name : currentPath+"/"+name;}
async function requestList(path){
  await sendLine("LIST\t"+path);
  const result=[];
  while(true){
    const line=await readLine();
    if(line==="END")break;
    if(line.startsWith("ERR"))throw new Error(line);
    const p=line.split("\t");
    if(p[0]==="DIR")result.push({dir:true,name:p.slice(1).join("\t")});
    else if(p[0]==="FILE")result.push({dir:false,size:Number(p[1]),name:p.slice(2).join("\t")});
  }
  return result;
}
function button(label,fn,secondary=true){
 const b=document.createElement("button");b.textContent=label;if(secondary)b.className="secondary";b.addEventListener("click",fn);return b;
}
async function loadDirectory(path){
 currentPath=path;$("path").textContent=path;$("files").replaceChildren();
 const list=await requestList(path);
 if(path!=="/"){
  const row=document.createElement("div");row.className="row";
  const name=document.createElement("div");name.className="filename dir";name.textContent="..";name.onclick=()=>loadDirectory(path.substring(0,path.lastIndexOf("/"))||"/");
  row.append(name);$("files").append(row);
 }
 for(const entry of list){
  const row=document.createElement("div");row.className="row";
  const name=document.createElement("div");name.className="filename"+(entry.dir?" dir":"");
  name.textContent=(entry.dir?"▸ ":"")+entry.name+(entry.dir?"/":"  ·  "+entry.size+" bytes");
  if(entry.dir)name.onclick=()=>loadDirectory(fullPath(entry.name));
  row.append(name);
  if(!entry.dir){
   const actions=document.createElement("div");actions.className="actions";
   actions.append(button("DOWNLOAD",()=>downloadFile(fullPath(entry.name)),true));
   actions.append(button("DELETE",()=>deleteFile(fullPath(entry.name)),true));
   row.append(actions);
  }
  $("files").append(row);
 }
 if(!list.length){const row=document.createElement("div");row.className="row";row.textContent="EMPTY DIRECTORY";$("files").append(row);}
}
async function downloadFile(path){
 try{
  setStatus("DOWNLOADING "+path);
  await sendLine("GET\t"+path);
  const header=(await readLine()).split("\t");
  if(header[0]!=="DATA")throw new Error(header.join(" "));
  const size=Number(header[1]);if(!Number.isFinite(size)||size<0||size>32*1024*1024)throw new Error("Invalid file size");
  const data=await readExact(size);
  const end=await readLine();if(end!=="END")throw new Error("Transfer checksum/end marker error");
  const blob=new Blob([data]);const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=path.split("/").pop();a.click();URL.revokeObjectURL(url);
  setStatus("DOWNLOAD COMPLETE");
 }catch(e){setStatus(e.message);}
}
async function deleteFile(path){
 if(!confirm("DELETE "+path+"?"))return;
 try{await sendLine("DELETE\t"+path);const result=await readLine();if(result!=="OK")throw new Error(result);setStatus("FILE DELETED");await loadDirectory(currentPath);}
 catch(e){setStatus(e.message);}
}
async function uploadFiles(files){
 for(const file of files){
  const path=fullPath(file.name);
  try{
   setStatus("UPLOADING "+file.name);
   await sendLine("PUT\t"+file.size+"\t"+path);
   const ready=await readLine();if(ready!=="READY")throw new Error(ready);
   await writer.write(new Uint8Array(await file.arrayBuffer()));
   const result=await readLine();if(result!=="OK")throw new Error(result);
  }catch(e){setStatus(e.message);return;}
 }
 setStatus("UPLOAD COMPLETE");$("upload").value="";await loadDirectory(currentPath);
}
async function disconnect(){
 try{if(connected){await sendLine("EXIT");await readLine();}}catch(e){}
 connected=false;
 try{if(reader){await reader.cancel();reader.releaseLock();}}catch(e){}
 try{if(writer){writer.releaseLock();}}catch(e){}
 try{if(port)await port.close();}catch(e){}
 reader=null;writer=null;port=null;rx=new Uint8Array(0);
 $("connect").disabled=false;$("disconnect").disabled=true;$("refresh").disabled=true;$("upload").disabled=true;
 $("uploadLabel").style.opacity=".4";$("uploadLabel").style.pointerEvents="none";
 $("files").replaceChildren();setStatus("DISCONNECTED");
}
$("connect").addEventListener("click",async()=>{
 try{
  if(!("serial" in navigator))throw new Error("USE CHROME OR EDGE");
  port=await navigator.serial.requestPort();await port.open({baudRate:115200,bufferSize:8192});
  reader=port.readable.getReader();writer=port.writable.getWriter();rx=new Uint8Array(0);
  await wait(350);await sendLine("PING");
  const pong=await readLine();if(pong!=="JOHNNY/1")throw new Error("JOHNNY FIRMWARE NOT READY");
  await sendLine("ENTER");const ready=await readLine();if(ready!=="READY")throw new Error(ready);
  connected=true;$("connect").disabled=true;$("disconnect").disabled=false;$("refresh").disabled=false;$("upload").disabled=false;
  $("uploadLabel").style.opacity="1";$("uploadLabel").style.pointerEvents="auto";
  setStatus("CONNECTED");await loadDirectory("/");
 }catch(e){setStatus(e.message);try{if(port)await port.close();}catch(_){}port=null;}
});
$("disconnect").addEventListener("click",disconnect);
$("refresh").addEventListener("click",()=>loadDirectory(currentPath).catch(e=>setStatus(e.message)));
$("upload").addEventListener("change",e=>uploadFiles(e.target.files));
window.addEventListener("beforeunload",()=>{try{if(writer)writer.releaseLock();if(reader)reader.cancel();}catch(e){}});
</script>
</body></html>
