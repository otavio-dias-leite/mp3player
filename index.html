<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>JOHNNY</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main aria-label="JOHNNY">
  <h1 class="wordmark">JOHNNY</h1>
</main>
<script>
(() => {
  const mark = document.querySelector('.wordmark');
  const glitch = () => {
    mark.classList.remove('glitch');
    void mark.offsetWidth;
    mark.classList.add('glitch');
    window.setTimeout(() => mark.classList.remove('glitch'), 260);
  };
  window.setTimeout(glitch, 900);
  window.setInterval(glitch, 6200 + Math.random() * 2400);
})();
</script>
</body>
</html>
